<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamdam Urdu Poetry</title>
    <!-- Google Noto Nastaliq Urdu Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Nastaliq Urdu', serif;
            background-color: #fdfbf7;
            color: #222;
            margin: 0;
            padding: 20px;
            text-align: center;
            line-height: 2.2;
        }
        header {
            margin-bottom: 30px;
            padding: 20px 10px;
            background: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            border-radius: 8px;
        }
        h1 {
            font-size: 2.2rem;
            color: #1a365d;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #4a5568;
            font-size: 1.1rem;
        }
        .book-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .book-card {
            background: #ffffff;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            padding: 25px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #1a365d;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <header>
        <h1>ہمدم اردو شاعری</h1>
        <p class="subtitle">خوش آمدید! نیچے دیے گئے بٹن سے آپ میری شاعری کی کتابیں آن لائن پڑھ سکتے ہیں۔</p>
    </header>

    <div class="book-container">
        <!-- Book 1 Card -->
        <div class="book-card">
            <h2>کتاب پڑھیں</h2>
            <p>آن لائن مطالعہ کے لیے نیچے دیے گئے بٹن پر کلک کریں۔</p>
            <!-- Change 'book1.pdf' below if your uploaded file has a different name -->
            <a href="book1.pdf" target="_blank" class="btn">کتاب کھولیں (Read Book)</a>
        </div>
    </div>

</body>
</html>
